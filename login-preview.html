    (function() {
      function showError(msg, url, line, col, err) {
        var overlay = document.getElementById('_error_overlay');
        if (!overlay) {
          overlay = document.createElement('div');
          overlay.id = '_error_overlay';
          overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#ffffff;color:#cc0000;z-index:99999;padding:20px;font-family:monospace;font-size:13px;overflow:auto;white-space:pre-wrap;';
          document.body.appendChild(overlay);
        }
        overlay.innerHTML += '<div style="margin-bottom:10px;border-bottom:1px solid #333;padding-bottom:10px;">';
        overlay.innerHTML += '<b style="color:#ef4444">❌ ERROR:</b> ' + (msg || 'Unknown error') + '
';
        if (url) overlay.innerHTML += 'URL: ' + url + '
';
        if (line) overlay.innerHTML += 'Line: ' + line + (col ? ':' + col : '') + '
';
        if (err && err.stack) overlay.innerHTML += '
Stack:
' + err.stack;
        overlay.innerHTML += '</div>';
      }
      window.onerror = function(msg, url, line, col, err) {
        showError(msg, url, line, col, err);
        return false;
      };
      window.addEventListener('unhandledrejection', function(e) {
        showError('Unhandled Promise Rejection: ' + (e.reason ? (e.reason.message || String(e.reason)) : 'Unknown'), '', '', '', e.reason);
      });
      console.error = (function(orig) {
        return function() {
          showError(Array.from(arguments).join(' '), '', '', '', null);
          orig.apply(console, arguments);
        };
      })(console.error);
    })();

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

function sha256(ascii) {
      function rightRotate(value, amount) {
        return (value>>>amount) | (value<<(32-amount));
      }
      var mathPow = Math.pow;
      var maxWord = mathPow(2, 32);
      var lengthProperty = 'length';
      var i, j;
      var result = '';
      var words = [];
      var asciiLength = ascii[lengthProperty]*8;
      // Always reset h and k so multiple calls produce correct results
      var hash = [];
      var k = [];
      var primeCounter = 0;
      var isPrime = function(n) {
        var divisor = 2;
        while (n % divisor) { divisor++; }
        return n === divisor;
      };
      var candidate = 2;
      while (primeCounter < 64) {
        if (isPrime(candidate)) {
          if (primeCounter < 8) {
            hash[primeCounter] = (mathPow(candidate, .5)*maxWord)|0;
          }
          k[primeCounter] = (mathPow(candidate, 1/3)*maxWord)|0;
          primeCounter++;
        }
        candidate++;
      }
      ascii += String.fromCharCode(128);
      while (ascii[lengthProperty] % 64 - 56) ascii += String.fromCharCode(0);
      for (i = 0; i < ascii[lengthProperty]; i++) {
        j = ascii.charCodeAt(i);
        if (j >> 8) return '';
        words[i>>2] |= j << ((3 - i)%4)*8;
      }
      words[words[lengthProperty]] = ((asciiLength/maxWord)|0);
      words[words[lengthProperty]] = (asciiLength|0);
      for (j = 0; j < words[lengthProperty];) {
        var w = words.slice(j, j += 16);
        var oldHash = hash.slice(0);
        hash = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
        for (i = 0; i < 64; i++) {
          if (i >= 16) {
            var l1 = w[i - 15], l2 = w[i - 2];
            w[i] = (rightRotate(l1, 7) ^ rightRotate(l1, 18) ^ (l1>>>3)) +
                   w[i - 7] +
                   (rightRotate(l2, 17) ^ rightRotate(l2, 19) ^ (l2>>>10)) +
                   w[i - 16];
          }
          var a = hash[0], e = hash[4];
          var temp1 = hash[7] +
                      (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25)) +
                      ((e & hash[5]) ^ (~e & hash[6])) +
                      k[i] +
                      (w[i] || 0);
          var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22)) +
                      ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
          hash = [(temp1 + temp2)|0].concat(hash);
          hash[4] = (hash[4] + temp1)|0;
          hash.length = 8;
        }
        for (i = 0; i < 8; i++) {
          hash[i] = (hash[i] + oldHash[i])|0;
        }
      }
      for (i = 0; i < 8; i++) {
        var s = (hash[i]>>>0).toString(16);
        result += (('00000000' + s).slice(-8));
      }
      return result;

    // ─── 2. EVENT BUS (EVENT-DRIVEN ARCHITECTURE) ───
    class EventBus {
      constructor() {
        this.subscribers = {};
      }
      subscribe(topic, callback) {
        if (!this.subscribers[topic]) this.subscribers[topic] = [];
        this.subscribers[topic].push(callback);
      }
      publish(topic, payload) {
        const callbacks = this.subscribers[topic] || [];
        callbacks.forEach(cb => cb(payload));
      }
    }
    const eventBus = new EventBus();

    // ─── 3. COMMAND PATTERN & HISTORY MANAGER ───
    class CommandHistory {
      constructor(setCameras) {
        this.undoStack = [];
        this.redoStack = [];
        this.setCameras = setCameras;
      }
      execute(command) {
        command.execute(this.setCameras);
        this.undoStack.push(command);
        this.redoStack = [];
        eventBus.publish('HISTORY_CHANGED', { canUndo: this.undoStack.length > 0, canRedo: false });
      }
      undo() {
        const cmd = this.undoStack.pop();
        if (cmd) {
          cmd.undo(this.setCameras);
          this.redoStack.push(cmd);
          eventBus.publish('HISTORY_CHANGED', { canUndo: this.undoStack.length > 0, canRedo: true });
        }
      }
      redo() {
        const cmd = this.redoStack.pop();
        if (cmd) {
          cmd.execute(this.setCameras);
          this.undoStack.push(cmd);
          eventBus.publish('HISTORY_CHANGED', { canUndo: this.undoStack.length > 0, canRedo: this.redoStack.length > 0 });
        }
      }
    }

    class MoveCameraCommand {
      constructor(cameraId, fromX, fromY, toX, toY) {
        this.cameraId = cameraId;
        this.fromX = fromX; this.fromY = fromY;
        this.toX = toX; this.toY = toY;
      }
      execute(setCameras) {
        setCameras(prev => prev.map(c => c.id === this.cameraId ? { ...c, x: this.toX, y: this.toY } : c));
      }
      undo(setCameras) {
        setCameras(prev => prev.map(c => c.id === this.cameraId ? { ...c, x: this.fromX, y: this.fromY } : c));
      }
    }

    class RotateCameraCommand {
      constructor(cameraId, fromAngle, toAngle) {
        this.cameraId = cameraId;
        this.fromAngle = fromAngle;
        this.toAngle = toAngle;
      }
      execute(setCameras) {
        setCameras(prev => prev.map(c => c.id === this.cameraId ? { ...c, angle: this.toAngle } : c));
      }
      undo(setCameras) {
        setCameras(prev => prev.map(c => c.id === this.cameraId ? { ...c, angle: this.fromAngle } : c));
      }
    }

    class UpdateCameraPropertiesCommand {
      constructor(cameraId, fromProps, toProps) {
        this.cameraId = cameraId;
        this.fromProps = fromProps;
        this.toProps = toProps;
      }
      execute(setCameras) {
        setCameras(prev => prev.map(c => c.id === this.cameraId ? { ...c, ...this.toProps } : c));
      }
      undo(setCameras) {
        setCameras(prev => prev.map(c => c.id === this.cameraId ? { ...c, ...this.fromProps } : c));
      }
    }

    // ─── 4. LAYOUT ENGINE (DYNAMIC COORDINATE CALCULATION) ───
    class LayoutEngine {
      static calculate(config) {
        const scale = config.dimensions.scale;
        const WL = config.margins.left;
        const WT = -7.5;
        const gap = config.margins.gap;
        
        const wA1 = config.warehouses[0].widthMeters * scale;
        const wA2 = config.warehouses[1].widthMeters * scale;
        const wA3 = config.warehouses[2].widthMeters * scale;
        
        const A12_X = WL + wA1;
        const A23_X = A12_X + wA2;
        const WR = A23_X + wA3;
        
        const Z_H = 56;
        const TR_BAY_W = 28;
        
        const PASS1_Y = 34.5;
        const PASS1_H = 42;
        const RoadTop_Bottom = 76.5;
        
        const Z3_Y = 81;
        const Z3_H = 122;
        const Z3_Bottom = 203;
        
        const T3_Y = 215;
        const T3_Bottom = T3_Y + Z_H;
        
        const EW_Y = 277.5;
        const EW_H = 42;
        const RoadMiddle_Bottom = 319.5;
        
        const T2_Y = 326;
        const T2_Bottom = T2_Y + Z_H;
        
        const Z2_Y = 394;
        const Z2_Bottom = Z2_Y + Z_H;
        
        const EW2_Y = 462;
        const EW2_H = 42;
        const RoadBottom_Bottom = 504;
        
        const Z1_Y = 518;
        const Z1_Bottom = Z1_Y + Z_H;
        
        const DOCK_Y = 574;
        const DOCK_H = 55;
        const DOCK_Bottom = DOCK_Y + DOCK_H;
        
        const T1_Y = 629;
        const WB = 574;

        return {
          WL, WR, WT, WB,
          A12_X, A23_X,
          PASS1_Y, PASS1_H, RoadTop_Bottom,
          Z3_Y, Z3_H, Z3_Bottom,
          T3_Y, T3_Bottom,
          EW_Y, EW_H, RoadMiddle_Bottom,
          T2_Y, T2_Bottom,
          Z2_Y, Z2_Bottom,
          EW2_Y, EW2_H, RoadBottom_Bottom,
          Z1_Y, Z1_Bottom,
          DOCK_Y, DOCK_H, DOCK_Bottom,
          T1_Y,
          Z_H, TR_BAY_W
        };
      }
    }

    // ─── 5. SNAP ENGINE ───
    class SnapEngine {
      static snap(x, y, snapConfig, layout, axesY) {
        let snapX = x;
        let snapY = y;
        let snapped = false;
        const threshold = snapConfig.snapThreshold;

        if (snapConfig.cameraLines) {
          for (const [lineId, axisY] of Object.entries(axesY)) {
            if (Math.abs(y - axisY) <= threshold) {
              snapY = axisY;
              snapped = true;
              break;
            }
          }
        }

        if (snapConfig.columns) {
          const spacing = DEFAULT_CONFIG.columns.spacingMeters * DEFAULT_CONFIG.dimensions.scale;
          const firstOffset = DEFAULT_CONFIG.columns.firstColumnOffset * DEFAULT_CONFIG.dimensions.scale;
          const colXPositions = [];
          let curX = layout.WL + firstOffset;
          for (let i = 0; i < 10; i++) {
            let cx = curX;
            if (Math.abs(curX - layout.A12_X) < 8) cx = layout.A12_X;
            else if (Math.abs(curX - layout.A23_X) < 8) cx = layout.A23_X;
            else if (Math.abs(curX - layout.WR) < 8) cx = layout.WR;
            colXPositions.push(cx);
            curX += spacing;
          }
          for (const colX of colXPositions) {
            if (Math.abs(x - colX) <= threshold) {
              snapX = colX;
              snapped = true;
              break;
            }
          }
        }

        if (snapConfig.grid && !snapped) {
          snapX = Math.round(x / 10) * 10;
          snapY = Math.round(y / 10) * 10;
          snapped = true;
        }

        return { x: snapX, y: snapY, snapped };
      }
    }

    // ─── 6. VALIDATION ENGINE ───
    class ValidationEngine {
      static validate(cameras, layout) {
        const errors = [];
        cameras.forEach(cam => {
          if (!cam.placed) return;
          const inBounds = cam.x >= layout.WL && cam.x <= layout.WR && 
                           cam.y >= layout.WT && cam.y <= 700;
          if (!inBounds) {
            errors.push({
              cameraId: cam.id,
              type: 'OUT_OF_BOUNDS',
              message: `Camera ${cam.id} nằm ngoài giới hạn bản vẽ!`
            });
          }

          const overlap = cameras.find(c => c.placed && c.id !== cam.id && 
            Math.sqrt((c.x - cam.x)**2 + (c.y - cam.y)**2) < 5
          );
          if (overlap) {
            errors.push({
              cameraId: cam.id,
              type: 'OVERLAP',
              message: `Camera ${cam.id} trùng vị trí với ${overlap.id}!`
            });
          }

          if (cam.axisId === 'line7' && cam.angle > 180 && cam.angle < 360) {
            errors.push({
              cameraId: cam.id,
              type: 'FACING_WALL',
              message: `Camera ${cam.id} sát vách trên đang hướng lên tường!`
            });
          }
        });
        return errors;
      }
    }

                  if (rememberMe) {
                    SafeStorage.setItem('jt_remember_username', username);
                    SafeStorage.setItem('jt_remember_me', 'true');

                    SafeStorage.setItem('jt_remember_me', 'false');

    // Main App
    const SCALE_FACTOR = 1.3;

    function App() {
      const layout = useMemo(() => LayoutEngine.calculate(DEFAULT_CONFIG), []);
      
      const [session, setSession] = useState(null);
      const [authChecked, setAuthChecked] = useState(false);
      const [cameras, setCameras] = useState(() => {
        try {
          const local = SafeStorage.getItem('jt_cameras_layout');

        }
      });

      // Check session on mount (Auto-Login)
      useEffect(() => {
        const token = SafeStorage.getItem('jt_session_token');
        if (!token) {
          setAuthChecked(true);
          return;
        }

        if (isAppsScript) {
          setLoading(true);
          google.script.run
            .withSuccessHandler((res) => {
              setLoading(false);
              setAuthChecked(true);
              if (res && res.success) {
                setSession(res.session);
                showToast("Đã tự động đăng nhập!");
              } else {
                SafeStorage.removeItem('jt_session_token');
              }
            })
            .withFailureHandler(() => {
              setLoading(false);
              setAuthChecked(true);
              SafeStorage.removeItem('jt_session_token');
            })
            .validateAndLoadSession(token);
        } else {
          // Local Mock Auto-Login
          setLoading(true);
          setTimeout(() => {
            setLoading(false);
            setAuthChecked(true);
            let mockRes = null;
            if (token === 'mock_session_owner') {
              mockRes = {
                userId: 'U001',
                username: 'owner',
                fullName: 'Hoàng Owner (Mock)',
                roleId: 'OWNER',

              };
            } else if (token === 'mock_session_admin') {
              mockRes = {
                userId: 'U002',

                fullName: 'Minh Admin (Mock)',
                roleId: 'ADMIN',
                permissions: ['camera.rotate', 'camera.fov', 'camera.range', 'camera.property']
              };
            } else if (token === 'mock_session_user') {
              mockRes = {
                userId: 'U003',
                username: 'user01',
                fullName: 'User Vận Hành (Mock)',

                permissions: ['warehouse.view', 'camera.view', 'zoom', 'pan']

            if (mockRes) {
              setSession(mockRes);

              SafeStorage.removeItem('jt_session_token');

        }
      }, [isAppsScript]);
      const [selectedCameraId, setSelectedCameraId] = useState(null);
      const [draggingCameraId, setDraggingCameraId] = useState(null);
      const [isDraggingMap, setIsDraggingMap] = useState(false);
      const [dragStart, setDragStart] = useState({ x: 0, y: 0 });
      const [scale, setScale] = useState(1);
      const [translateX, setTranslateX] = useState(0);
      const [translateY, setTranslateY] = useState(0);
      
      const [searchTerm, setSearchTerm] = useState('');
      const [filterTab, setFilterTab] = useState('all');
      const [tickerText] = useState('J&T CARGO HCM HUB - HỆ THỐNG GIÁM SÁT CAMERA HOẠT ĐỘNG ỔN ĐỊNH');
      const [loading, setLoading] = useState(false);
      const isAppsScript = IS_APPS_SCRIPT;
      const [toast, setToast] = useState(null);
      const [camerasLoading, setCamerasLoading] = useState(false);
      const [renderedCount, setRenderedCount] = useState(100);

      const [showCmdPalette, setShowCmdPalette] = useState(false);
      const [cmdQuery, setCmdQuery] = useState('');
      const [isPanelExpanded, setIsPanelExpanded] = useState(false);
      const [isInputFocused, setIsInputFocused] = useState(false);

      useEffect(() => {
        const handleOpen = () => setShowCmdPalette(true);
        window.addEventListener('open-command-palette', handleOpen);
        
        // Listen to phím tắt hệ thống (Ctrl+K, Esc, G+D, G+C, G+A, G+S, Z+1/2/3)
        let keyBuffer = '';
        let keyTimeout;

        const handleKeyDown = (e) => {
          // Tránh chặn các phím trong các trường input/textarea
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
            if (e.key === 'Escape' && showCmdPalette) {
              setShowCmdPalette(false);
            }
            return;
          }

          if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
            e.preventDefault();
            setShowCmdPalette(prev => !prev);
            setCmdQuery('');
            return;
          }

          if (e.key === 'Escape') {
            setShowCmdPalette(false);
            setSelectedCameraId(null);
            setSelectedZone(null);
            setSelectedRoadId(null);
            setSelectedDockId(null);
            return;
          }

          // Buffer cho chuỗi phím tắt (G+D, G+C, v.v.)
          if (e.key === 'g' || e.key === 'z') {
            keyBuffer = e.key;
            clearTimeout(keyTimeout);
            keyTimeout = setTimeout(() => { keyBuffer = ''; }, 1000);
            return;
          }

          if (keyBuffer === 'g') {
            if (e.key === 'd') {
              e.preventDefault();
              setWorkspace('Warehouse Layout'); // Mock Dashboard view
              showToast("Chuyển hướng: Dashboard (Warehouse Map)", "info");
            } else if (e.key === 'c') {
              e.preventDefault();
              setWorkspace('Camera Layout');
              showToast("Chuyển hướng: Sơ đồ Camera", "info");
            } else if (e.key === 'a') {
              e.preventDefault();
              showToast("Phím tắt: Mở trung tâm cảnh báo (Alert Center)...", "info");
            } else if (e.key === 's') {
              e.preventDefault();
              showToast("Phím tắt: Mở cài đặt hệ thống (Settings)...", "info");
            }
            keyBuffer = '';
          } else if (keyBuffer === 'z') {
            const num = parseInt(e.key);
            if (num >= 1 && num <= 3) {
              e.preventDefault();
              setSelectedZone(num);
              setWorkspace('Camera Layout');
              showToast(`Chuyển nhanh sang Zone ${num}`, "success");
            }
            keyBuffer = '';
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => {
          window.removeEventListener('open-command-palette', handleOpen);
          window.removeEventListener('keydown', handleKeyDown);
        };
      }, [showCmdPalette]);

      useEffect(() => {
        if (session) {
          setRenderedCount(100);
        }
      }, [session, cameras]);

      useEffect(() => {
        const placedCams = cameras.filter(c => c.placed);
        if (placedCams.length > renderedCount) {
          const handle = requestAnimationFrame(() => {
            setRenderedCount(prev => Math.min(prev + 150, placedCams.length));
          });
          return () => cancelAnimationFrame(handle);
        }
      }, [cameras, renderedCount]);

      useEffect(() => {
        if (selectedCameraId) {
          setIsPanelExpanded(true);
        }
      }, [selectedCameraId]);
      
      const [selectedZone, setSelectedZone] = useState(null);
      const [selectedRoadId, setSelectedRoadId] = useState(null);
      const [selectedDockId, setSelectedDockId] = useState(null);
      
      const [workspace, setWorkspace] = useState('Camera Layout');
      const [viewMode, setViewMode] = useState('Camera Mode');
      const [plugins, setPlugins] = useState({ heatmap: false, aiDetection: false });
      const [snapConfig, setSnapConfig] = useState({ grid: false, walls: true, columns: true, cameraLines: true, snapThreshold: 8 });
      
      const [rotatingCameraId, setRotatingCameraId] = useState(null);
      const [axesY, setAxesY] = useState({
        line7: 36,
        line6: 200,
        line5: 320,
        line4: 430,
        line3: 539,
        line2: 568,
        line1: 629
      });
      const [chuteNames, setChuteNames] = useState(() => {
        try {
          const local = SafeStorage.getItem('jt_chute_names');
          return local ? JSON.parse(local) : {};
        } catch (e) {
          return {};
        }
      });
      // Tracks the last known config_version from server for auto-polling
      const serverConfigVerRef = useRef("0");
      const pollIntervalRef = useRef(null);

      const historyManager = useRef(null);
      if (!historyManager.current) {
        historyManager.current = new CommandHistory(setCameras);
      }

      const svgRef = useRef(null);
      const innerGroupRef = useRef(null);

      // Load initial config (versions & chute names) and check camera cache
      useEffect(() => {
        if (!session) return;

        if (isAppsScript) {
          setCamerasLoading(true);
          google.script.run
            .withSuccessHandler((initialConfig) => {
              // 1. Always set layout names in real-time
              if (initialConfig && initialConfig.chuteNames) {
                setChuteNames(initialConfig.chuteNames);
                SafeStorage.setItem('jt_chute_names', JSON.stringify(initialConfig.chuteNames));
              }
              
              const serverCamsVer = initialConfig.cams_version || "0";
              const localCamsVer = SafeStorage.getItem('jt_cameras_version');
              
              // 2. Fetch cameras only if version mismatched or cache missing
              if (localCamsVer !== serverCamsVer || !SafeStorage.getItem('jt_cameras_layout')) {
                google.script.run
                  .withSuccessHandler((serverCams) => {
                    if (serverCams && Array.isArray(serverCams)) {
                      setCameras(prev => prev.map(c => {
                        const dbC = serverCams.find(item => item.id === c.id);
                        return dbC ? { ...c, x: dbC.x, y: dbC.y, placed: dbC.placed, angle: dbC.angle, spread: dbC.spread, range: dbC.range } : c;
                      }));
                      SafeStorage.setItem('jt_cameras_layout', JSON.stringify(serverCams));
                      SafeStorage.setItem('jt_cameras_version', serverCamsVer);
                    }
                    setCamerasLoading(false);
                  })
                  .withFailureHandler(() => setCamerasLoading(false))
                  .loadCameraLayout(session.token);
              } else {
                // Cache hit: Load from LocalStorage instantly
                const localData = SafeStorage.getItem('jt_cameras_layout');
                if (localData) {
                  const dbCams = JSON.parse(localData);
                  setCameras(prev => prev.map(c => {
                    const dbC = dbCams.find(item => item.id === c.id);
                    return dbC ? { ...c, x: dbC.x, y: dbC.y, placed: dbC.placed, angle: dbC.angle, spread: dbC.spread, range: dbC.range } : c;
                  }));
                }
                setCamerasLoading(false);
              }
            })
            .withFailureHandler((err) => {
              console.error("loadInitialConfig failed:", err);
              setCamerasLoading(false);
              // Fallback load layout directly
              google.script.run
                .withSuccessHandler((dbCams) => {
                  if (dbCams && Array.isArray(dbCams)) {
                    setCameras(prev => prev.map(c => {
                      const dbC = dbCams.find(item => item.id === c.id);
                      return dbC ? { ...c, x: dbC.x, y: dbC.y, placed: dbC.placed, angle: dbC.angle, spread: dbC.spread, range: dbC.range } : c;
                    }));
                  }
                })
                .loadCameraLayout(session.token);
            })
            .loadInitialConfig();
        } else {
          // Local mock mode loading
          setCamerasLoading(true);
          setTimeout(() => {
            setCamerasLoading(false);
          }, 300);
        }
      }, [session, isAppsScript]);

      // ── Auto-polling: detect Config sheet changes every 30 seconds ──
      useEffect(() => {
        if (!session || !isAppsScript) return;

        const checkConfigVersion = () => {
          google.script.run
            .withSuccessHandler((versions) => {
              if (!versions) return;
              const latestVer = versions.config_version || "0";
              // If server bumped config_version since our last load, reload Bưu cục names
              if (latestVer !== serverConfigVerRef.current && serverConfigVerRef.current !== "0") {
                serverConfigVerRef.current = latestVer;
                google.script.run
                  .withSuccessHandler((initialConfig) => {
                    if (initialConfig && initialConfig.chuteNames) {
                      setChuteNames(initialConfig.chuteNames);
                      SafeStorage.setItem('jt_chute_names', JSON.stringify(initialConfig.chuteNames));
                      console.log("[AutoPoll] Bưu cục names refreshed from server.");
                    }
                    if (initialConfig) {
                      serverConfigVerRef.current = initialConfig.config_version || latestVer;
                    }
                  })
                  .withFailureHandler((err) => console.warn("[AutoPoll] loadInitialConfig failed:", err))
                  .loadInitialConfig();
              } else if (serverConfigVerRef.current === "0") {
                // First poll: initialize the baseline version
                serverConfigVerRef.current = latestVer;
              }
            })
            .withFailureHandler((err) => console.warn("[AutoPoll] getVersionMarkers failed:", err))
            .getVersionMarkers();
        };

        // Poll every 30 seconds
        pollIntervalRef.current = setInterval(checkConfigVersion, 30000);

        return () => {
          if (pollIntervalRef.current) {
            clearInterval(pollIntervalRef.current);
            pollIntervalRef.current = null;
          }
        };
      }, [session, isAppsScript]);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3000);
      };

      // Permission Helper
      const hasPermission = (p) => {
        if (!session) return false;
        if (session.roleId === 'OWNER') return true;
        return session.permissions && session.permissions.indexOf(p) !== -1;
      };

      const handleZoomIn = () => setScale(prev => Math.min(prev + 0.15, 4));
      const handleZoomOut = () => setScale(prev => Math.max(prev - 0.15, 0.4));
      const handleResetZoom = () => {
        setScale(1);
        setTranslateX(0);
        setTranslateY(0);
        showToast("Đã thiết lập lại khung hình!");
      };

      const handleWheel = (e) => {
        if (!hasPermission('zoom') && !hasPermission('pan')) return;
        e.preventDefault();
        const zoomStep = 0.08;
        if (e.deltaY < 0) {
          setScale(prev => Math.min(prev + zoomStep, 4));
        } else {
          setScale(prev => Math.max(prev - zoomStep, 0.4));
        }
      };

      const getSvgCoordinates = (clientX, clientY) => {
        if (!svgRef.current) return { x: 0, y: 0 };
        const rect = svgRef.current.getBoundingClientRect();
        const x = (clientX - rect.left) * (1100 / rect.width);
        const y = (clientY - rect.top) * (720 / rect.height);
        
        const cx = 550;
        const cy = 330;
        const mappedX = cx + (x - cx - translateX) / (scale * SCALE_FACTOR);
        const mappedY = cy + (y - cy - translateY) / (scale * SCALE_FACTOR);
        
        return { x: Math.round(mappedX), y: Math.round(mappedY) };
      };

        // Cập nhật lại hàm handleSvgMouseDown
      const handleSvgMouseDown = (e) => {
      const target = e.target;
  
      // Dò tìm element cha gần nhất có chứa attribute
      const camEl = target.closest('[data-camera-id]');
      const camId = camEl ? camEl.getAttribute('data-camera-id') : null;
  
    if (camId) {
    e.stopPropagation();
    setSelectedCameraId(camId);
    setSelectedZone(null);
    setSelectedRoadId(null);
    setSelectedDockId(null);
    
    if (hasPermission('camera.edit')) {
      setDraggingCameraId(camId);
    }
    return;
    }

    const roadEl = target.closest('[data-road-id]');
    const roadId = roadEl ? roadEl.getAttribute('data-road-id') : null;
    if (roadId) {
    setSelectedRoadId(roadId);
    setSelectedZone(null);
    setSelectedCameraId(null);
    setSelectedDockId(null);
    return;
    }

    const dockEl = target.closest('[data-dock-id]');
    const dockId = dockEl ? dockEl.getAttribute('data-dock-id') : null;
    if (dockId) {
    setSelectedDockId(dockId);
    setSelectedZone(null);
    setSelectedCameraId(null);
    setSelectedRoadId(null);
    return;
    }

    // Click ra ngoài background
    if (target === svgRef.current || target.id === 'mesh-bg') {
    setSelectedCameraId(null);
    setSelectedZone(null);
    setSelectedRoadId(null);
    setSelectedDockId(null);
    
    if (hasPermission('pan')) {
      setIsDraggingMap(true);
      setDragStart({ x: e.clientX - translateX, y: e.clientY - translateY });
    }
    }
  };

      const handleSvgMouseMove = (e) => {
        if (rotatingCameraId) {
          e.preventDefault();
          const { x, y } = getSvgCoordinates(e.clientX, e.clientY);
          const cam = cameras.find(c => c.id === rotatingCameraId);
          if (cam) {
            const dx = x - cam.x;
            const dy = y - cam.y;
            let newAngle = Math.round((Math.atan2(dy, dx) * 180) / Math.PI);
            if (newAngle < 0) newAngle += 360;
            newAngle = Math.round(newAngle / 5) * 5;
            setCameras(prev => prev.map(c => c.id === rotatingCameraId ? { ...c, angle: newAngle } : c));
          }
        } else if (draggingCameraId) {
          e.preventDefault();
          const { x, y } = getSvgCoordinates(e.clientX, e.clientY);
          const cam = cameras.find(c => c.id === draggingCameraId);
          if (cam) {
            const snapped = SnapEngine.snap(x, y, snapConfig, layout, axesY);
            
            let axisId = cam.axisId;
            if (cam.axisId) {
              const currentAxisY = axesY[cam.axisId];
              if (Math.abs(y - currentAxisY) > 12) {
                axisId = null;
              }
            } else {
              for (const [lineId, ly] of Object.entries(axesY)) {
                if (Math.abs(y - ly) <= snapConfig.snapThreshold) {
                  axisId = lineId;
                  break;
                }
              }
            }

            setCameras(prev => prev.map(c => c.id === draggingCameraId ? { 
              ...c, 
              x: snapped.x, 
              y: axisId ? axesY[axisId] : snapped.y,
              axisId 
            } : c));
          }
        } else if (isDraggingMap) {
          setTranslateX(e.clientX - dragStart.x);
          setTranslateY(e.clientY - dragStart.y);
        }
      };

      const handleSvgMouseUp = () => {
        if (draggingCameraId) {
          const cam = cameras.find(c => c.id === draggingCameraId);
          const originalCam = initialCameras.find(c => c.id === draggingCameraId);
          if (cam && originalCam && (cam.x !== originalCam.x || cam.y !== originalCam.y)) {
            const cmd = new MoveCameraCommand(cam.id, originalCam.x, originalCam.y, cam.x, cam.y);
            historyManager.current.execute(cmd);
          }
          setDraggingCameraId(null);
        }
        if (rotatingCameraId) {
          const cam = cameras.find(c => c.id === rotatingCameraId);
          const originalCam = initialCameras.find(c => c.id === rotatingCameraId);
          if (cam && originalCam && cam.angle !== originalCam.angle) {
            const cmd = new RotateCameraCommand(cam.id, originalCam.angle, cam.angle);
            historyManager.current.execute(cmd);
          }
          setRotatingCameraId(null);
        }
        setIsDraggingMap(false);
      };

      const handleSvgDoubleClick = (e) => {
        if (!hasPermission('camera.edit')) return;
        e.preventDefault();
        const { x, y } = getSvgCoordinates(e.clientX, e.clientY);
        const nextUnplaced = cameras.find(c => !c.placed);
        if (nextUnplaced) {
          const snapped = SnapEngine.snap(x, y, snapConfig, layout, axesY);
          let axisId = null;
          for (const [lineId, ly] of Object.entries(axesY)) {
            if (Math.abs(y - ly) <= snapConfig.snapThreshold) {
              axisId = lineId;
              break;
            }
          }

          const cmd = new UpdateCameraPropertiesCommand(nextUnplaced.id, { placed: false }, { 
            placed: true, 
            x: snapped.x, 
            y: axisId ? axesY[axisId] : snapped.y,
            axisId
          });
          historyManager.current.execute(cmd);
          setSelectedCameraId(nextUnplaced.id);
          showToast(`Đã đặt camera ${nextUnplaced.id}!`);
        } else {
          showToast("Đã lắp đặt hết 158 camera!", "warning");
        }
      };

      const handlePropertyChange = (field, val) => {
        if (!selectedCameraId) return;
        const cam = cameras.find(c => c.id === selectedCameraId);
        if (cam) {
          const oldProps = { [field]: cam[field] };
          const newProps = { [field]: val };
          const cmd = new UpdateCameraPropertiesCommand(cam.id, oldProps, newProps);
          historyManager.current.execute(cmd);
        }
      };

      const handleRecallCamera = (id) => {
        const cam = cameras.find(c => c.id === id);
        if (cam) {
          const cmd = new UpdateCameraPropertiesCommand(id, { placed: true, x: cam.x, y: cam.y, axisId: cam.axisId }, { placed: false, axisId: null });
          historyManager.current.execute(cmd);
          setSelectedCameraId(null);
          showToast(`Đã thu hồi camera ${id}!`);
        }
      };

      const handlePlaceCameraAtCenter = (id) => {
        const nextX = Math.round(layout.WL + (layout.WR - layout.WL) / 2);
        const nextY = Math.round(layout.WT + (layout.WB - layout.WT) / 2);
        const cmd = new UpdateCameraPropertiesCommand(id, { placed: false }, { placed: true, x: nextX, y: nextY, axisId: null });
        historyManager.current.execute(cmd);
        setSelectedCameraId(id);
        showToast(`Đã đặt camera ${id} lên bản đồ!`);
      };

      const handleSaveLayout = () => {
        setLoading(true);
        if (isAppsScript) {
          google.script.run
            .withSuccessHandler((res) => {
              setLoading(false);
              if (res && res.success) {
                SafeStorage.setItem('jt_cameras_layout', JSON.stringify(cameras));
                if (res.version) {
                  SafeStorage.setItem('jt_cameras_version', res.version);
                }
                showToast("Lưu thiết lập camera lên Google Sheets thành công!");
              } else {
                showToast("Lỗi khi lưu lên Google Sheets: " + (res ? res.error : "Không có phản hồi"), "warning");
              }
            })
            .withFailureHandler((err) => {
              setLoading(false);
              showToast("Lỗi kết nối khi lưu: " + (err && err.message ? err.message : String(err)), "warning");
            })
            .saveCameraLayout(JSON.stringify(cameras), session.token);
        } else {
          SafeStorage.setItem('jt_cameras_layout', JSON.stringify(cameras));
          setTimeout(() => {
            setLoading(false);
            showToast("Lưu thiết lập camera vào Trình duyệt cục bộ thành công!");
          }, 600);
        }
      };

      const handleSyncData = () => {
        if (loading) return;
        setLoading(true);
        showToast("Đang đồng bộ dữ liệu mới nhất từ Google Sheets...");
        
        if (isAppsScript) {
          google.script.run
            .withSuccessHandler((res) => {
              if (res && res.success) {
                // Clear client camera cache to force reload
                SafeStorage.removeItem('jt_cameras_layout');
                SafeStorage.removeItem('jt_cameras_version');
                
                // Step 1: Re-fetch Bưu cục names + versions
                google.script.run
                  .withSuccessHandler((initialConfig) => {
                    if (initialConfig && initialConfig.chuteNames) {
                      setChuteNames(initialConfig.chuteNames);
                      SafeStorage.setItem('jt_chute_names', JSON.stringify(initialConfig.chuteNames));
                    }
                    if (initialConfig) {
                      serverConfigVerRef.current = initialConfig.config_version || "0";
                    }
                    // Step 2: Also reload camera positions from server
                    google.script.run
                      .withSuccessHandler((serverCams) => {
                        if (serverCams && Array.isArray(serverCams)) {
                          setCameras(prev => prev.map(c => {
                            const dbC = serverCams.find(item => item.id === c.id);
                            return dbC ? { ...c, x: dbC.x, y: dbC.y, placed: dbC.placed, angle: dbC.angle, spread: dbC.spread, range: dbC.range } : c;
                          }));
                          SafeStorage.setItem('jt_cameras_layout', JSON.stringify(serverCams));
                          if (initialConfig && initialConfig.cams_version) {
                            SafeStorage.setItem('jt_cameras_version', initialConfig.cams_version);
                          }
                        }
                        setLoading(false);
                        showToast("Đồng bộ thành công! Đã làm mới sơ đồ và Bưu cục.", "success");
                      })
                      .withFailureHandler(() => {
                        setLoading(false);
                        showToast("Đồng bộ Bưu cục thành công, nhưng lỗi khi tải camera layout.", "warning");
                      })
                      .loadCameraLayout(session.token);

                    setLoading(false);
                    showToast("Lỗi khi tải cấu hình Bưu cục mới.", "warning");
                  })
                  .loadInitialConfig();
              } else {
                setLoading(false);
                showToast("Đồng bộ thất bại: " + (res ? res.error : "Không có phản hồi"), "warning");
              }
            })
            .withFailureHandler((err) => {
              setLoading(false);
              showToast("Lỗi kết nối: " + String(err), "warning");
            })
            .clearServerCache();
        } else {
          setTimeout(() => {
            setLoading(false);
            showToast("Môi trường localhost - Không đồng bộ thực tế!", "info");
          }, 1000);
        }

      const handleGeneratePresets = () => {
        if (confirm("Bạn có chắc chắn muốn khôi phục toàn bộ 158 vị trí camera mặc định theo AutoCAD?")) {

      const filteredCameras = cameras.filter(cam => {
        const matchesSearch = cam.id.toLowerCase().includes(searchTerm.toLowerCase()) ||

        if (!matchesSearch) return false;
        if (filterTab === 'placed') return cam.placed;
        if (filterTab === 'unplaced') return !cam.placed;
        return true;
      });

      const validationErrors = useMemo(() => ValidationEngine.validate(cameras, layout), [cameras, layout]);

      const getFovPath = (cam) => {
        const rad = Math.PI / 180;
        const angle = cam.angle || 0;
        const spread = cam.spread || 60;
        const range = cam.range || 80;
        
        const startAng = angle - (spread / 2);
        const endAng = angle + (spread / 2);
        
        const x1 = Math.round(range * Math.cos(startAng * rad));
        const y1 = Math.round(range * Math.sin(startAng * rad));
        const x2 = Math.round(range * Math.cos(endAng * rad));
        const y2 = Math.round(range * Math.sin(endAng * rad));
        
        return `M 0,0 L ${x1},${y1} A ${range},${range} 0 0,1 ${x2},${y2} Z`;
      };

                        }
                      });
                      
                      if ('zone 1'.includes(query) || 'z1'.includes(query)) {
                        results.push({ id: 'z1', label: 'Chuyển sang Zone 1', action: () => { setSelectedZone(1); setWorkspace('Camera Layout'); } });
                      }
                      if ('zone 2'.includes(query) || 'z2'.includes(query)) {
                        results.push({ id: 'z2', label: 'Chuyển sang Zone 2', action: () => { setSelectedZone(2); setWorkspace('Camera Layout'); } });
                      }
                      if ('zone 3'.includes(query) || 'z3'.includes(query)) {
                        results.push({ id: 'z3', label: 'Chuyển sang Zone 3', action: () => { setSelectedZone(3); setWorkspace('Camera Layout'); } });
                      }
                    }

                    if (results.length === 0) {
                      return <div className="text-center py-6 text-xs text-text-muted">Không tìm thấy kết quả phù hợp</div>;
                    }

                    return results.slice(0, 8).map(item => (
                      <button 
                        key={item.id} 
                        onClick={() => { item.action(); setShowCmdPalette(false); }}
                        className="w-full text-left px-3 py-2 text-xs rounded-lg text-text-secondary hover:text-text-primary hover:bg-surface-hover flex items-center justify-between"
                      >
                        <span>{item.label}</span>
                        <span className="text-[10px] text-text-muted font-mono">↵ Chọn</span>
                      </button>
                    ));
                  })()}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render App
    const rootEl = document.getElementById('root');
    const loader = document.getElementById('init-loader');
    const reactRoot = ReactDOM.createRoot(rootEl);
    reactRoot.render(<App />);
    // Loader sẽ bị React thay thế khi render xong
    if (loader) {
      setTimeout(() => { if (loader.parentNode) loader.style.display = 'none'; }, 500);
    }
  </script>
</body>
</html>
