name: Backend Data Sync

on:
  workflow_dispatch:          # Cho phép chạy thủ công từ GitHub UI
  push:
    branches: [main]
    paths:
      - 'backend_sync/sync_to_sheets.py'
      - 'backend_sync/config/**'
      - '.github/workflows/sync.yml'

permissions:
  contents: write             # Cần để commit data files trở lại repo

concurrency:
  group: 'backend-sync'
  cancel-in-progress: false   # Không hủy sync đang chạy

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25       # Timeout 25 phút (sync thường ~5-10 phút)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r backend_sync/requirements.txt

      - name: Run backend sync
        env:
          PYTHONUNBUFFERED:           "1"
          SYSTEM_ACCOUNT:             ${{ secrets.SYSTEM_ACCOUNT }}
          SYSTEM_PASSWORD:            ${{ secrets.SYSTEM_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          NEON_POOLER_URL:            ${{ secrets.NEON_POOLER_URL }}
        run: |
          cd backend_sync
          python -u sync_to_sheets.py --sync-only
        continue-on-error: false

      - name: Commit & push updated data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Pull latest trước khi push tránh conflict
          git pull --rebase origin main || true

          # Stage chỉ các file data (không commit DB lớn)
          git add data/*.json src/data/*.json backend_sync/config/valid.csv || true

          # Chỉ commit nếu có thay đổi thực sự
          if git diff --staged --quiet; then
            echo "✅ Không có thay đổi mới, bỏ qua commit."
          else
            git commit -m "chore(data): auto-sync $(date -u +'%Y-%m-%d %H:%M') UTC [skip ci]"
            git push origin main
            echo "✅ Đã push data mới lên GitHub."
          fi
