name: Ultra-Fast Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - 'src/**'
      - 'data/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment_1.outputs.page_url || steps.deployment_2.outputs.page_url || steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build singlefile bundle
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages (Attempt 1)
        id: deployment_1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retry (Attempt 2)
        if: steps.deployment_1.outcome != 'success'
        run: sleep 20

      - name: Deploy to GitHub Pages (Attempt 2)
        id: deployment_2
        if: steps.deployment_1.outcome != 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before final retry (Attempt 3)
        if: steps.deployment_1.outcome != 'success' && steps.deployment_2.outcome != 'success'
        run: sleep 30

      - name: Deploy to GitHub Pages (Attempt 3)
        id: deployment
        if: steps.deployment_1.outcome != 'success' && steps.deployment_2.outcome != 'success'
        uses: actions/deploy-pages@v4
