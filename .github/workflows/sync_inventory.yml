name: Sync Inventory to GitHub Data

on:
  workflow_dispatch:          # Cho phép chạy thủ công

concurrency:
  group: sync-inventory
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0   # ✅ Full history để rebase không bị lỗi shallow

    - name: Cache SQLite database  # ⚡ Bảo toàn dữ liệu đơn tồn đọng & thời gian lấy hàng lịch sử giữa các lần chạy tự động
      uses: actions/cache@v4
      with:
        path: backend_sync/db/
        key: ${{ runner.os }}-sqlite-db-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-sqlite-db-

    - name: Cache data/ JSON files  # ⚡ Restore historical data (Arrival, Outbound) between runs
      uses: actions/cache@v4
      with:
        path: data/
        key: ${{ runner.os }}-data-json-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-data-json-

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache pip packages   # ⚡ Giảm ~20s cold start mỗi lần chạy
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend_sync/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f backend_sync/requirements.txt ]; then pip install -r backend_sync/requirements.txt; fi

    - name: Run sync script
      env:
        SYSTEM_ACCOUNT: ${{ secrets.SYSTEM_ACCOUNT }}
        SYSTEM_PASSWORD: ${{ secrets.SYSTEM_PASSWORD }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        NEON_POOLER_URL: ${{ secrets.NEON_POOLER_URL }}
        GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        PYTHONUNBUFFERED: "1"
      run: |
        python backend_sync/sync_to_sheets.py

    - name: Commit and push data/ JSON files
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        # Fetch latest remote commits in case someone pushed while this job was running
        git fetch origin main
        
        # Soft reset to origin/main so our newly generated data files remain as local modifications on top of the latest remote commit
        git reset --soft origin/main
        
        git add data/ src/data/
        if git diff --staged --quiet; then
          echo "No data changes to commit."
        else
          git commit -m "chore: auto-update data JSON files [skip ci]"
          git push origin main
        fi
