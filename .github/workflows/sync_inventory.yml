name: Sync Inventory to Google Sheets

on:
  push:
    branches:
      - main
    paths:
      - 'backend_sync/**'
      - '.github/workflows/sync_inventory.yml'
  schedule:
    # Runs every 30 mins from 6:00 AM VN time (23:00 UTC) to 10:00 PM VN time (15:00 UTC)
    - cron: '*/30 23 * * *'    # 23:00–23:59 UTC = 06:00–06:59 SA giờ VN
    - cron: '*/30 0-15 * * *'  # 00:00–15:59 UTC = 07:00–22:59 TỐI giờ VN
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cache SQLite database  # ⚡ Bảo toàn dữ liệu đơn tồn đọng & thời gian lấy hàng lịch sử giữa các lần chạy tự động
      uses: actions/cache@v4
      with:
        path: backend_sync/db/
        key: ${{ runner.os }}-sqlite-db-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-sqlite-db-

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache pip packages   # ⚡ Giảm ~20s cold start mỗi lần chạy
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend_sync/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f backend_sync/requirements.txt ]; then pip install -r backend_sync/requirements.txt; fi

    - name: Check secrets configuration
      run: |
        if [ -z "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}" ]; then
          echo "❌ GOOGLE_SERVICE_ACCOUNT_JSON is NOT configured in GitHub Secrets!"
          exit 1
        else
          echo "✅ GOOGLE_SERVICE_ACCOUNT_JSON is present."
        fi

    - name: Run sync script (Inventory + Giam sat phat hang merged)
      env:
        SYSTEM_ACCOUNT: ${{ secrets.SYSTEM_ACCOUNT }}
        SYSTEM_PASSWORD: ${{ secrets.SYSTEM_PASSWORD }}
        GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # ⚡ Dùng để push data/latest.json.gz
        GH_REPO: ${{ github.repository }}             # lehoangtienpham2395/sortation-center-layout
      run: |
        python backend_sync/sync_to_sheets.py
