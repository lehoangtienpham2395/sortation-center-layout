name: Sync Inventory to Google Sheets

on:
  push:
    branches:
      - main
  schedule:
    # Runs every 30 mins from 6:00 AM VN time (23:00 UTC) to 10:00 PM VN time (15:00 UTC)
    - cron: '*/30 23 * * *'    # 23:00–23:59 UTC = 06:00–06:59 SA giờ VN
    - cron: '*/30 0-15 * * *'  # 00:00–15:59 UTC = 07:00–22:59 TỐI giờ VN
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f backend_sync/requirements.txt ]; then pip install -r backend_sync/requirements.txt; fi

    - name: Check secrets configuration
      run: |
        if [ -z "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}" ]; then
          echo "❌ GOOGLE_SERVICE_ACCOUNT_JSON is NOT configured in GitHub Secrets! The sync script cannot write to Google Sheets."
          exit 1
        else
          echo "✅ GOOGLE_SERVICE_ACCOUNT_JSON is present."
        fi

    - name: Run sync script
      env:
        SYSTEM_ACCOUNT: ${{ secrets.SYSTEM_ACCOUNT }}
        SYSTEM_PASSWORD: ${{ secrets.SYSTEM_PASSWORD }}
        GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      run: |
        python backend_sync/sync_to_sheets.py > sync_output.log 2>&1
        cat sync_output.log

    - name: Commit log file
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add -f sync_output.log || true
        git commit -m "Auto-commit sync run logs [skip ci]" || true
        git push origin main || true

