name: Sync Inventory to Google Sheets

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f backend_sync/requirements.txt ]; then pip install -r backend_sync/requirements.txt; fi

    - name: Run sync script
      env:
        SYSTEM_ACCOUNT: ${{ secrets.SYSTEM_ACCOUNT }}
        SYSTEM_PASSWORD: ${{ secrets.SYSTEM_PASSWORD }}
        GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      run: |
        python backend_sync/sync_to_sheets.py
